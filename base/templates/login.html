<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Chatbot Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <div class="container">
        <div class="login-form">
            <div class="header">
                <h2>Welcome Back</h2>
                <p class="subtitle">Sign in to your account to continue</p>
            </div>

            <form method="POST" action="/login" id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" autocomplete="current-password" name="password" required placeholder="••••••••">
                        <button type="button" class="toggle-password" onclick="toggleLoginPw()" title="Show / hide password" aria-label="Show password">
                            <svg id="lp-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg id="lp-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none; pointer-events:none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox" name="remember" id="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="/forgot-password" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary">Sign In</button>
            </form>

            <div class="signup-link">
                Don't have an account? <a href="/register">Sign up</a>
            </div>
        </div>
    </div>

    <script>
        function toggleLoginPw() {
            var input = document.getElementById('password');
            var showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            document.getElementById('lp-eye-open').style.display = showing ? '' : 'none';
            document.getElementById('lp-eye-off').style.display  = showing ? 'none' : '';
        }
    </script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>

    <!-- Flask flash messages → toasts -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <script>
                document.addEventListener('DOMContentLoaded', function () {
                    {% for category, message in messages %}
                        {# Map Flask category names to toast types #}
                        {% if category == 'error' %}
                            showToast('error', 'Error', '{{ message }}');
                        {% elif category == 'success' %}
                            showToast('success', 'Success', '{{ message }}');
                        {% elif category == 'warning' %}
                            showToast('warning', 'Warning', '{{ message }}');
                        {% else %}
                            showToast('info', 'Notice', '{{ message }}');
                        {% endif %}
                    {% endfor %}
                });
            </script>
        {% endif %}
    {% endwith %}

</body>
</html>
