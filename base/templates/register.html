<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ChatBot Builder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/tost.css') }}">
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <div class="register-card">
        <div class="header">
            <h1>Create Account</h1>
            <p class="subtitle">Start building your chatbot</p>
        </div>

        <form method="POST" id="registerForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name" required placeholder="John">
                </div>

                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" required placeholder="Doe">
                </div>
            </div>

            <div class="form-group">
                <label for="User_name">Username</label>
                <input type="text" id="User_name" name="User_name" required placeholder="JohnDoe25">
            </div>

            <div class="form-group">
                <label for="email">Email ID</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <div class="phone-input-wrapper" style="position: relative; display: flex; align-items: stretch;">
        <span class="prefix-box">
            +91
        </span>
                    <input type="tel" id="phone" name="phone" required placeholder="98765 43210">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                    <button type="button" class="toggle-password" onclick="toggleRegPw('password','rp-eye-open','rp-eye-off')" title="Show / hide password" aria-label="Show password">
                        <svg id="rp-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg id="rp-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none; pointer-events:none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="••••••••">
                    <button type="button" class="toggle-password" onclick="toggleRegPw('confirm_password','rcp-eye-open','rcp-eye-off')" title="Show / hide password" aria-label="Show confirm password">
                        <svg id="rcp-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg id="rcp-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none; pointer-events:none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a></label>
            </div>

            <button type="submit" class="btn-submit">Create Account</button>
        </form>

        <div class="footer">
            <p class="footer-text">Already have an account? <a href="/login">Sign in</a></p>
        </div>
    </div>

    <script>
        function toggleRegPw(fieldId, openId, offId) {
            var input = document.getElementById(fieldId);
            var showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            document.getElementById(openId).style.display = showing ? '' : 'none';
            document.getElementById(offId).style.display  = showing ? 'none' : '';
        }
    </script>
    <script src="{{ url_for('static', filename='js/register.js') }}"></script>

    <script>
    /* ══ TOAST SYSTEM ══ */
    var toastIcons = {
        success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
        error:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
        warning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
        info:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
    };

    function showToast(type, title, msg, duration) {
        duration = duration || 4000;
        var c = document.getElementById('toastContainer');
        var t = document.createElement('div');
        t.className = 'toast ' + type;
        t.innerHTML = '<div class="toast-icon-wrap">' + (toastIcons[type]||toastIcons.info) + '</div>' +
            '<div class="toast-body"><p class="toast-title">' + title + '</p><p class="toast-msg">' + msg + '</p></div>' +
            '<button class="toast-close" aria-label="Close">&#x2715;</button>' +
            '<div class="toast-progress" style="animation-duration:' + duration + 'ms;"></div>';

        t.querySelector('.toast-close').addEventListener('click', function(){ removeToast(t); });
        c.appendChild(t);

        setTimeout(function(){ t.classList.add('show'); }, 20);
        t._timer = setTimeout(function(){ removeToast(t); }, duration);
    }

    function removeToast(t) {
        if (!t || t.classList.contains('hide')) return;
        clearTimeout(t._timer); t.classList.remove('show'); t.classList.add('hide');
        setTimeout(function(){ if(t.parentElement) t.remove(); }, 420);
    }
    </script>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <script>
                document.addEventListener('DOMContentLoaded', function () {
                    {% for category, message in messages %}
                        {% if category == 'error' or category == 'danger' %}
                            showToast('error', 'Error', '{{ message }}');
                        {% elif category == 'success' %}
                            showToast('success', 'Success', '{{ message }}');
                        {% elif category == 'warning' %}
                            showToast('warning', 'Warning', '{{ message }}');
                        {% else %}
                            showToast('info', 'Notice', '{{ message }}');
                        {% endif %}
                    {% endfor %}
                });
            </script>
        {% endif %}
    {% endwith %}

</body>
</html>
