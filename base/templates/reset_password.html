<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - ChatBot Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tost.css') }}">
    <style>
        /* ── Password field wrapper ─────────────────────────────────── */
        .pw-field {
            position: relative;
            display: flex;
            align-items: center;
        }

        .pw-field .pw-left-icon {
            position: absolute;
            left: 14px;
            color: #718096;
            pointer-events: none;
            z-index: 2;
            display: flex;
            align-items: center;
        }

        .pw-field input {
            width: 100%;
            padding: 12px 46px 12px 44px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            background: #f7fafc;
            transition: all 0.2s;
            color: #1a202c;
        }

        .pw-field input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .pw-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            padding: 4px;
            cursor: pointer;
            color: #a0aec0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: color 0.2s, background 0.15s;
        }

        .pw-toggle:hover {
            color: #667eea;
            background: rgba(102, 126, 234, 0.08);
        }

        .pw-toggle svg {
            display: block;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Reset Password</h1>
                <p>Enter your new password below</p>
            </div>

            <form method="POST" class="auth-form" id="resetPasswordForm">

                <!-- New Password -->
                <div class="form-group">
                    <label for="password">New Password</label>
                    <div class="pw-field">
                        <span class="pw-left-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input type="password" id="password" name="password"
                               placeholder="Enter new password" required minlength="6">
                        <button type="button" class="pw-toggle"
                                onclick="togglePw('password', this)"
                                title="Show / hide password" aria-label="Show password">
                            <svg id="eye-open-password" width="18" height="18" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg id="eye-off-password" width="18" height="18" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 style="display:none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <div class="pw-field">
                        <span class="pw-left-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input type="password" id="confirm_password" name="confirm_password"
                               placeholder="Confirm new password" required minlength="6">
                        <button type="button" class="pw-toggle"
                                onclick="togglePw('confirm_password', this)"
                                title="Show / hide password" aria-label="Show confirm password">
                            <svg id="eye-open-confirm_password" width="18" height="18" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg id="eye-off-confirm_password" width="18" height="18" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 style="display:none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    Reset Password
                </button>
            </form>

            <div class="auth-footer">
                <a href="{{ url_for('login') }}" class="back-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back to Login
                </a>
            </div>
        </div>

        <div class="auth-background">
            <div class="gradient-circle circle-1"></div>
            <div class="gradient-circle circle-2"></div>
            <div class="gradient-circle circle-3"></div>
        </div>
    </div>

    <script>
        /* ── Toast System (same as login) ───────────────────────────────────── */
        var toastIcons = {
            success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
            error:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
            warning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
            info:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
        };

        function showToast(type, title, msg, duration) {
            duration = duration || 4000;
            var c = document.getElementById('toastContainer');
            var t = document.createElement('div');
            t.className = 'toast ' + type;
            t.innerHTML =
                '<div class="toast-icon-wrap">' + (toastIcons[type] || toastIcons.info) + '</div>' +
                '<div class="toast-body"><p class="toast-title">' + title + '</p><p class="toast-msg">' + msg + '</p></div>' +
                '<button class="toast-close" aria-label="Close">&#x2715;</button>' +
                '<div class="toast-progress" style="animation-duration:' + duration + 'ms;"></div>';

            t.querySelector('.toast-close').addEventListener('click', function () { removeToast(t); });
            c.appendChild(t);
            setTimeout(function () { t.classList.add('show'); }, 20);
            t._timer = setTimeout(function () { removeToast(t); }, duration);
        }

        function removeToast(t) {
            if (!t || t.classList.contains('hide')) return;
            clearTimeout(t._timer);
            t.classList.remove('show');
            t.classList.add('hide');
            setTimeout(function () { if (t.parentElement) t.remove(); }, 420);
        }

        /* ── Eye Toggle ─────────────────────────────────────────────────────── */
        function togglePw(fieldId, btn) {
            var input = document.getElementById(fieldId);
            if (!input) return;
            var showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            document.getElementById('eye-open-' + fieldId).style.display = showing ? '' : 'none';
            document.getElementById('eye-off-'  + fieldId).style.display = showing ? 'none' : '';
            input.focus();
        }

        /* ── Validate passwords match before submit ─────────────────────────── */
        document.getElementById('resetPasswordForm').addEventListener('submit', function (e) {
            var pw  = document.getElementById('password').value;
            var cpw = document.getElementById('confirm_password').value;
            if (pw !== cpw) {
                e.preventDefault();
                showToast('error', 'Passwords Do Not Match', 'Please make sure both passwords are identical.');
            }
        });
    </script>

    <!-- Flask flash messages → toasts (same pattern as login) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <script>
                document.addEventListener('DOMContentLoaded', function () {
                    {% for category, message in messages %}
                        {% if category == 'error' or category == 'danger' %}
                            showToast('error', 'Error', '{{ message }}');
                        {% elif category == 'success' %}
                            showToast('success', 'Success', '{{ message }}');
                        {% elif category == 'warning' %}
                            showToast('warning', 'Warning', '{{ message }}');
                        {% else %}
                            showToast('info', 'Notice', '{{ message }}');
                        {% endif %}
                    {% endfor %}
                });
            </script>
        {% endif %}
    {% endwith %}

</body>
</html>
